<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <header>
            <h1>My AI Chatbot</h1>
        </header>

        <main id="chat"></main>

        <form id="chat-form">
            <input
                id="message"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
            />

            <button type="submit">
                Send
            </button>
        </form>

    </div>

    <script src="app.js"></script>

</body>
</html>
